<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Masuk CMS | Asli Jaya Interior</title>
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script src="/assets/js/login.js" defer></script>
</head>
<body class="admin-auth-page">
  <main class="login-shell">
    <a class="admin-brand" href="/"><img src="/assets/images/logo.png" alt="Logo CV Asli Jaya Tama" width="56" height="56"><span>ASLI JAYA <small>INTERIOR</small></span></a>
    <section class="login-panel" aria-labelledby="login-title">
      <span class="admin-eyebrow">PENGELOLA KONTEN</span>
      <h1 id="login-title">Masuk ke CMS</h1>
      <p>Kelola dokumentasi proyek, foto, dan video CV Asli Jaya Tama.</p>
      <form id="login-form">
        <label for="email">Email admin</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Kata sandi</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-message" class="admin-message" role="alert" hidden></p>
        <button class="admin-button" type="submit">Masuk <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <a class="back-site" href="/">← Kembali ke situs</a>
  </main>
</body>
</html>
