name: Sync Google Drive videos

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-drive-videos.yml'
      - 'scripts/sync_drive_videos.py'

permissions:
  contents: write

concurrency:
  group: drive-video-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sync parser and merge
        run: python -m unittest discover -s tests
      - name: Read folder and add new videos
        env:
          DRIVE_FOLDER_ID: 1lIegtho751s1vbYxGzqPKypC8QcPZVa_
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: python scripts/sync_drive_videos.py
      - name: Rebuild static website
        run: php scripts/build-static.php
      - name: Verify generated links and assets
        run: node scripts/verify-static.js
      - name: Commit and push new videos
        run: |
          git add config/drive_videos.json public/assets/images/thumbnails dist
          if git diff --cached --quiet; then
            echo "No new videos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync new Google Drive videos"
          git push origin HEAD:main
